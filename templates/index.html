<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LGS Singles Search</title>

    <meta name="description" content="Search for Magic: the Gathering singles across local game stores.">
    <meta name="theme-color" content="#8a8a8a">

    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ preview_title }}">
    <meta property="og:description" content="Search for Magic: the Gathering singles across local game stores.">
    <meta property="og:url" content="{{ request.url }}">
    <meta property="og:image" content="{{ request.url_root }}static/og-image.png?v=5">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="400">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ preview_title }}">
    <meta name="twitter:description" content="Search for Magic: the Gathering singles across local game stores.">
    <meta name="twitter:image" content="{{ request.url_root }}static/og-image.png?v=5">
    <script>
        // Runs before the page paints so light-mode visitors don't see a dark
        // flash: a saved choice wins, otherwise follow the system setting.
        (function () {
            var theme;
            try { theme = localStorage.getItem('theme'); } catch (e) {}
            if (theme !== 'light' && theme !== 'dark') {
                theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            }
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <style>
        :root {
            --bg-dark: #0e1012;
            --surface-dark: #1a1d21;
            --surface-raised: #202327;
            --border-color: #2c3036;
            --text-main: #f2f4f7;
            --text-dim: #9aa0a8;
            --text-faint: #6b7078;
            --accent-blue: #5865f2;
            --accent-blue-bright: #6d78ff;
            --accent-green: #23a559;
            --retroshark: #2a9d8f;
            --redcastle: #e63946;
            --goingaming: #23a559;
            --error-text: #ff6b74;
            --foil-gold: #ffd700;
            --badge-default: #2c3036;
            --spinner-track: rgba(255,255,255,0.12);
            --shadow-color: rgba(0,0,0,0.4);
            color-scheme: dark;
        }

        /* data-theme is set before first paint by the script in <head>. */
        :root[data-theme="light"] {
            --bg-dark: #f3f4f6;
            --surface-dark: #ffffff;
            --surface-raised: #f7f8fa;
            --border-color: #d8dbe0;
            --text-main: #16181c;
            --text-dim: #4f555e;
            --text-faint: #646a73;
            --accent-blue-bright: #4752c4;
            --accent-green: #1a8045;
            --error-text: #c8202f;
            --foil-gold: #a87a00;
            --badge-default: #646a73;
            --spinner-track: rgba(0,0,0,0.1);
            --shadow-color: rgba(20,24,30,0.12);
            color-scheme: light;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 40px 24px 40px;
            display: flex;
            justify-content: center;
            line-height: 1.4;
            min-height: 100vh;
        }

        .container { width: 100%; max-width: 1400px; display: flex; flex-direction: column; }

        header.page-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 28px;
        }

        .title-block h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .eyebrow {
            display: block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent-blue-bright);
            margin-bottom: 6px;
        }

        .repo-link {
            color: var(--text-faint);
            font-size: 13px;
            text-decoration: none;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            transition: color 0.15s;
        }
        .repo-link:hover { color: var(--text-dim); }

        .page-footer { text-align: center; margin-top: auto; padding-top: 56px; }

        .vendor-list {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 8px;
            font-size: 12px;
            color: var(--text-faint);
            margin-bottom: 20px;
        }
        .vendor-list .vendor-label { color: var(--text-dim); font-weight: 600; }
        .vendor-list .sep { color: var(--text-faint); }
        .vendor-list a {
            color: var(--text-faint);
            text-decoration: none;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            transition: color 0.15s;
        }
        .vendor-list a:hover { color: var(--accent-blue-bright); }

        .search-panel {
            background: var(--surface-dark);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        textarea {
            width: 100%;
            height: 133px;
            background: var(--surface-raised);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 16px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 13.5px;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        textarea::placeholder { color: var(--text-faint); }
        textarea:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(88,101,242,0.15); }

        .action-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 22px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s ease, background 0.15s ease;
        }
        .btn-search { background: var(--accent-blue); color: white; }
        .btn-search:not(:disabled):hover { background: var(--accent-blue-bright); }
        .btn-clear { background: transparent; color: var(--text-dim); border: 1px solid var(--border-color); }
        .btn-clear:not(:disabled):hover { border-color: var(--text-faint); color: var(--text-main); }
        button:not(:disabled):hover { transform: translateY(-1px); }
        button:not(:disabled):active { transform: translateY(0); }
        button:disabled { opacity: 0.45; cursor: not-allowed; }

        #status {
            font-size: 13px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
        }

        .spinner { width: 14px; height: 14px; border: 2px solid var(--spinner-track); border-top-color: var(--accent-blue-bright); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
        .checkmark { color: var(--accent-green); font-weight: bold; margin-right: 6px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            margin: 20px 0 8px;
        }

        .chip-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        .store-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12.5px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid var(--border-color);
            background: var(--surface-dark);
            color: var(--text-faint);
            cursor: pointer;
            user-select: none;
            opacity: 0.55;
            filter: grayscale(70%);
            transition: border-color 0.15s, color 0.15s, background 0.15s, opacity 0.15s, filter 0.15s;
        }
        .store-chip:hover { opacity: 0.8; }
        .store-chip .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
        .store-chip.active {
            color: var(--text-main);
            border-color: var(--dot-color, var(--border-color));
            background: var(--surface-raised);
            opacity: 1;
            filter: none;
        }
        .store-chip:not(.active) { text-decoration: line-through; }
        .store-chip input { display: none; }

        .merge-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-dim);
            cursor: pointer;
            user-select: none;
        }
        .merge-toggle input { cursor: pointer; accent-color: var(--accent-blue); width: 14px; height: 14px; }
        .merge-toggle .merge-hint { color: var(--text-faint); font-size: 11.5px; }

        .sort-row { display: flex; align-items: center; gap: 8px; }
        .sort-row label { font-size: 13px; color: var(--text-dim); }

        .export-row { display: flex; align-items: center; gap: 8px; }
        .export-row .export-label { font-size: 13px; color: var(--text-dim); }
        .btn-export {
            padding: 7px 12px;
            font-size: 12.5px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--surface-dark);
            color: var(--text-dim);
        }
        .btn-export:not(:disabled):hover { border-color: var(--accent-blue); color: var(--text-main); }

        select {
            background: var(--surface-dark);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 7px 10px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            font-size: 13px;
        }

        .search-term-group { margin-top: 36px; animation: fadeIn 0.3s ease-in; }

        .term-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            font-size: 15px;
            font-weight: 700;
            padding-bottom: 10px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-main);
        }

        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }

        .card-tile {
            background: var(--surface-dark);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            transition: border-color 0.2s, transform 0.15s ease, box-shadow 0.15s ease;
        }
        .card-tile.hidden-by-filter { display: none !important; }
        .card-tile.hidden-by-merge { display: none !important; }
        .card-tile:hover { border-color: var(--accent-blue); transform: translateY(-3px); box-shadow: 0 10px 24px var(--shadow-color); }

        .tile-link { text-decoration: none; color: inherit; display: block; }

        .tile-image-wrap { position: relative; width: 100%; aspect-ratio: 5 / 7; background: var(--bg-dark); }
        .card-image { width: 100%; height: 100%; object-fit: cover; display: block; }

        .badge {
            position: absolute; top: 8px; left: 8px;
            font-size: 9.5px; font-weight: 700; padding: 3px 7px;
            border-radius: 4px; color: white; text-transform: uppercase;
            letter-spacing: 0.03em;
            box-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }
        .badge-redcastle { background: var(--redcastle); }
        .badge-goingaming { background: var(--goingaming); }
        .badge-retroshark { background: var(--retroshark); }
        .badge-default { background: var(--badge-default); }

        /* Foil cards get a rainbow sheen drifting across the image, in two
           layers: an overlay blend that richly tints mid and dark art, and a
           plain low-opacity wash so the colors still show on white cards,
           which overlay can't brighten any further. Both scroll right with a
           transform, which is cheap to animate on many tiles at once. The
           loop is seamless because the stripes repeat every 435px along the
           115deg gradient, which is 435 / sin(115deg) = 480px horizontally,
           exactly the distance each loop moves.
           .foil-sheen must not get opacity, a transform or z-index: any of
           those would isolate the layers and stop them blending with the
           image. */
        .foil-sheen { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        .foil-sheen::before,
        .foil-sheen::after {
            content: ''; position: absolute; top: 0; bottom: 0; left: -480px; width: calc(100% + 480px);
            background: repeating-linear-gradient(115deg,
                #d24c8f 0, #cc9e33 87px, #2db376 174px, #3398cc 261px, #9a55d5 348px, #d24c8f 435px);
            animation: foil-shimmer 7.5s linear infinite;
            transition: opacity 0.2s;
        }
        .foil-sheen::before { mix-blend-mode: overlay; opacity: 0.6; }
        .foil-sheen::after { opacity: 0.2; }
        .card-tile:hover .foil-sheen::before { opacity: 0.8; }
        .card-tile:hover .foil-sheen::after { opacity: 0.28; }
        @keyframes foil-shimmer { from { transform: translateX(0); } to { transform: translateX(480px); } }
        @media (prefers-reduced-motion: reduce) { .foil-sheen::before, .foil-sheen::after { animation: none; } }
        .foil-star-inline { color: var(--foil-gold); font-weight: 700; margin-left: 3px; }

        .tile-body { padding: 12px; }
        .card-name { font-weight: 600; font-size: 13.5px; color: var(--text-main); margin-bottom: 2px; line-height: 1.25; }
        .card-set { font-size: 11.5px; color: var(--text-faint); margin-bottom: 8px; }

        .tile-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .condition { font-size: 11.5px; color: var(--text-dim); }
        .price { font-size: 16px; font-weight: 700; color: var(--accent-green); }

        .store-link {
            display: block; margin-top: 10px; font-size: 11px; font-weight: 600;
            color: var(--text-faint); transition: color 0.15s;
        }
        .card-tile:hover .store-link { color: var(--accent-blue-bright); }

        .empty-state {
            grid-column: 1 / -1; text-align: center; padding: 22px;
            color: var(--text-faint); border: 1px dashed var(--border-color);
            border-radius: 10px; font-size: 13px;
        }

        .term-errors { display: flex; flex-wrap: wrap; gap: 6px; margin: -8px 0 14px; }
        .term-errors:empty { display: none; }
        .vendor-error-badge {
            font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px;
            background: rgba(230, 57, 70, 0.12); color: var(--error-text);
            border: 1px solid rgba(230, 57, 70, 0.35);
            text-transform: none; letter-spacing: normal; cursor: help;
        }
        .status-error { color: var(--error-text); }

        #scrollToTop {
            position: fixed; bottom: 30px; right: 30px; width: 46px; height: 46px;
            border-radius: 50%; background: var(--accent-blue); color: white;
            border: none; cursor: pointer; font-size: 18px; box-shadow: 0 4px 15px var(--shadow-color);
            z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s;
        }
        #scrollToTop.show { opacity: 1; visibility: visible; }
        #scrollToTop:hover { background: var(--accent-blue-bright); }

        .top-actions {
            position: fixed; top: 16px; right: 16px; z-index: 1000;
            display: flex; align-items: center; gap: 8px;
        }
        .side-link {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 14px; border-radius: 999px;
            background: var(--surface-raised); border: 1px solid var(--border-color);
            color: var(--text-dim); font-size: 13px; text-decoration: none;
            box-shadow: 0 4px 15px var(--shadow-color); transition: all 0.2s;
        }
        .side-link strong { color: var(--text-main); font-weight: 600; }
        .side-link:hover { border-color: var(--accent-blue); color: var(--text-main); }

        /* Light/dark switch: sun on the left, moon on the right, and a blue
           knob that slides to the active mode. */
        .theme-switch {
            position: relative; flex-shrink: 0;
            width: 68px; height: 36px; padding: 0;
            border-radius: 999px;
            background: var(--surface-raised); border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px var(--shadow-color);
        }
        .theme-switch:not(:disabled):hover { border-color: var(--accent-blue); }
        .theme-switch:focus-visible { outline: 2px solid var(--accent-blue-bright); outline-offset: 2px; }
        .theme-switch .track-icon {
            position: absolute; top: 50%; width: 14px; height: 14px;
            transform: translateY(-50%); color: var(--text-faint);
        }
        .theme-switch .track-icon.sun { left: 10px; }
        .theme-switch .track-icon.moon { right: 10px; }
        .theme-switch svg { display: block; width: 100%; height: 100%; }
        .theme-switch .knob {
            position: absolute; top: 3px; left: 3px;
            width: 28px; height: 28px; border-radius: 50%;
            background: var(--accent-blue); color: white;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
            transition: transform 0.2s ease;
        }
        .theme-switch .knob span { width: 15px; height: 15px; }
        :root[data-theme="dark"] .theme-switch .knob { transform: translateX(32px); }
        :root[data-theme="dark"] .theme-switch .knob .sun,
        :root[data-theme="light"] .theme-switch .knob .moon { display: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 640px) {
            body { padding: 20px 12px 72px; }

            header.page-header { flex-direction: column; align-items: flex-start; gap: 6px; margin-bottom: 20px; }
            .repo-link { font-size: 11px; word-break: break-all; }
            .title-block h1 { font-size: 21px; }
            .vendor-list { font-size: 11px; margin-bottom: 16px; }

            .search-panel { padding: 14px; border-radius: 10px; }
            textarea { height: 133px; font-size: 16px; }

            .action-row { flex-direction: column; align-items: stretch; gap: 10px; }
            .action-row button { width: 100%; padding: 12px 20px; }
            #status { justify-content: center; }

            .toolbar { flex-direction: column; align-items: stretch; gap: 12px; margin: 16px 0 4px; }
            .chip-group { justify-content: center; }
            .merge-toggle { justify-content: center; }
            .sort-row { justify-content: space-between; }
            select { flex: 1; }
            .export-row { justify-content: center; flex-wrap: wrap; }

            .search-term-group { margin-top: 28px; }
            .term-header { font-size: 13px; }

            .results-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
            .tile-body { padding: 9px; }
            .card-name { font-size: 12px; }
            .card-set { font-size: 10.5px; }
            .price { font-size: 14px; }

            .top-actions { position: static; margin-bottom: 16px; }
            .side-link { flex: 1; justify-content: center; font-size: 12px; }
            #scrollToTop { bottom: 16px; right: 16px; width: 42px; height: 42px; font-size: 16px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-actions">
        <button type="button" class="theme-switch" id="themeSwitch" role="switch" aria-checked="true" aria-label="Dark mode" title="Switch light / dark mode" onclick="toggleTheme()">
            <span class="track-icon sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></span>
            <span class="track-icon moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
            <span class="knob"><span class="sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></span><span class="moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span></span>
        </button>
        <a class="side-link" href="https://mtg.aschneider.tech/32dc/" target="_blank" rel="noopener">Also see: <strong>32 Deck Challenge tracker</strong> &rarr;</a>
    </div>

    <header class="page-header">
        <div class="title-block">
            <span class="eyebrow">Local Game Store Scraper</span>
            <h1>LGS Singles Search</h1>
        </div>
    </header>

    <div class="vendor-list">
        <span class="vendor-label">Searching:</span>
        <a href="https://retrosharkgaming.tcgplayerpro.com" target="_blank">retrosharkgaming.tcgplayerpro.com</a>
        <span class="sep">-</span>
        <a href="https://redcastle.tcgplayerpro.com" target="_blank">redcastle.tcgplayerpro.com</a>
        <span class="sep">-</span>
        <a href="https://goingaming.tcgplayerpro.com" target="_blank">goingaming.tcgplayerpro.com</a>
    </div>

    <div class="search-panel">
        <textarea id="cardInput" autofocus placeholder="Enter card names, one per line.&#10;Supported formats include:&#10;- Sol Ring&#10;- 1 Sol Ring&#10;- 1x Sol Ring"></textarea>
        <div class="action-row">
            <button id="searchBtn" class="btn-search" onclick="startSearch()">Search</button>
            <button id="copyLinkBtn" type="button" class="btn-clear" onclick="copySearchLink()">Copy Link</button>
            <button id="resetBtn" class="btn-clear" onclick="isSearching ? stopSearch() : clearSearch()">Clear</button>
            <div id="status"></div>
        </div>
    </div>

    <div class="toolbar">
        <div class="chip-group" id="storeFilters">
            <label class="store-chip active" style="--dot-color: var(--redcastle)" data-store="redcastle">
                <input type="checkbox" checked onchange="toggleStoreFilter('redcastle', this.checked, this.closest('.store-chip'))">
                <span class="dot" style="background: var(--redcastle)"></span>
                Red Castle <span id="count-redcastle">(0)</span>
            </label>
            <label class="store-chip active" style="--dot-color: var(--goingaming)" data-store="goingaming">
                <input type="checkbox" checked onchange="toggleStoreFilter('goingaming', this.checked, this.closest('.store-chip'))">
                <span class="dot" style="background: var(--goingaming)"></span>
                GoinGaming <span id="count-goingaming">(0)</span>
            </label>
            <label class="store-chip active" style="--dot-color: var(--retroshark)" data-store="retroshark">
                <input type="checkbox" checked onchange="toggleStoreFilter('retroshark', this.checked, this.closest('.store-chip'))">
                <span class="dot" style="background: var(--retroshark)"></span>
                Retro Shark <span id="count-retroshark">(0)</span>
            </label>
        </div>
        <label class="merge-toggle">
            <input type="checkbox" id="mergeToggle" checked onchange="toggleMergeResults(this.checked)">
            Merge Results <span class="merge-hint">(best condition only)</span>
        </label>
        <div class="sort-row">
            <label for="sortOrder">Sort by</label>
            <select id="sortOrder" onchange="sortAllGrids()">
                <option value="alpha">Alphabetical (A-Z)</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
            </select>
        </div>
        <div class="export-row">
            <span class="export-label">Export Visible Results</span>
            <button type="button" id="exportTxtBtn" class="btn-export" onclick="exportResults('txt')" disabled>TXT</button>
            <button type="button" id="exportCsvBtn" class="btn-export" onclick="exportResults('csv')" disabled>CSV</button>
            <button type="button" id="exportJsonBtn" class="btn-export" onclick="exportResults('json')" disabled>JSON</button>
        </div>
    </div>

    <div id="output"></div>

    <footer class="page-footer">
        <a href="https://github.com/ASchneider-GitHub/tcgplayerpro-scraper"
           target="_blank"
           class="repo-link">
           github.com/ASchneider-GitHub/tcgplayerpro-scraper
        </a>
    </footer>
</div>

<button id="scrollToTop" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">↑</button>

<script>
    function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
        document.getElementById('themeSwitch').setAttribute('aria-checked', String(theme === 'dark'));
    }

    function toggleTheme() {
        const theme = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
        applyTheme(theme);
        try { localStorage.setItem('theme', theme); } catch (e) {}
    }

    applyTheme(document.documentElement.dataset.theme);

    // Until the visitor picks a theme, keep following the system setting.
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', e => {
        let saved = null;
        try { saved = localStorage.getItem('theme'); } catch (err) {}
        if (!saved) applyTheme(e.matches ? 'light' : 'dark');
    });

    let isSearching = false;
    let currentAbortController = null;
    const allowedStores = new Set(['redcastle', 'goingaming', 'retroshark']);
    let allResults = [];
    let mergeResults = true;

    const CONDITION_ORDER = ['Near Mint', 'Lightly Played', 'Moderately Played', 'Heavily Played', 'Damaged'];
    function conditionRank(conditionName) {
        const base = (conditionName || '').replace(/\s*Foil\s*$/i, '').trim();
        const idx = CONDITION_ORDER.indexOf(base);
        return idx === -1 ? CONDITION_ORDER.length : idx;
    }

    function toggleMergeResults(isChecked) {
        mergeResults = isChecked;
        document.querySelectorAll('.results-grid').forEach(applyMergeFilterToGrid);
    }

    function applyMergeFilterToGrid(grid) {
        const tiles = Array.from(grid.children).filter(t => t.classList.contains('card-tile'));
        if (!mergeResults) {
            tiles.forEach(t => t.classList.remove('hidden-by-merge'));
            return;
        }
        const bestByGroup = new Map();
        tiles.forEach(tile => {
            const key = `${tile.dataset.vendorClean}|${tile.dataset.productId}|${tile.dataset.isFoil}`;
            const rank = parseInt(tile.dataset.conditionRank, 10);
            const current = bestByGroup.get(key);
            if (!current || rank < current.rank) bestByGroup.set(key, { tile, rank });
        });
        const bestTiles = new Set(Array.from(bestByGroup.values()).map(v => v.tile));
        tiles.forEach(tile => tile.classList.toggle('hidden-by-merge', !bestTiles.has(tile)));
    }

    window.onscroll = function() {
        const topBtn = document.getElementById("scrollToTop");
        if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
            topBtn.classList.add("show");
        } else {
            topBtn.classList.remove("show");
        }
    };

    function toggleStoreFilter(storeKey, isChecked, labelEl) {
        if (isChecked) {
            allowedStores.add(storeKey);
        } else {
            allowedStores.delete(storeKey);
        }
        if (labelEl) labelEl.classList.toggle('active', isChecked);
        applyFilters();
    }

    function applyFilters() {
        document.querySelectorAll('.card-tile').forEach(tile => {
            const vendorClean = tile.dataset.vendorClean;
            const isAllowed = Array.from(allowedStores).some(key => vendorClean.includes(key));
            tile.classList.toggle('hidden-by-filter', !isAllowed);
        });
    }

    // Stop keeps whatever has loaded; startSearch() handles the abort and
    // marks the cards that never got searched.
    function stopSearch() {
        if (currentAbortController) currentAbortController.abort();
    }

    function clearSearch() {
        document.getElementById('output').innerHTML = "";
        document.getElementById('status').innerHTML = "";
        document.getElementById('cardInput').value = "";
        storeCounts = { redcastle: 0, goingaming: 0, retroshark: 0 };
        updateStoreUI();
        allResults = [];
        setExportEnabled(false);
    }

    function setExportEnabled(enabled) {
        ['exportTxtBtn', 'exportCsvBtn', 'exportJsonBtn'].forEach(id => {
            document.getElementById(id).disabled = !enabled;
        });
    }

    function exportResults(format) {
        const data = allResults.filter(item => {
            const vendorClean = item.vendor.toLowerCase();
            return Array.from(allowedStores).some(key => vendorClean.includes(key));
        });
        if (data.length === 0) return;

        const stamp = new Date().toISOString().replace(/[:.]/g, '-');
        let content, mime, filename;

        if (format === 'json') {
            content = JSON.stringify(data, null, 2);
            mime = 'application/json';
            filename = `lgs-search-results-${stamp}.json`;
        } else if (format === 'csv') {
            const headers = ['query', 'vendor', 'name', 'setName', 'conditionName', 'languageName', 'isFoil', 'price', 'quantity', 'storeUrl'];
            const escapeCsv = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
            const rows = [headers.join(',')].concat(
                data.map(item => headers.map(h => escapeCsv(item[h])).join(','))
            );
            content = rows.join('\r\n');
            mime = 'text/csv';
            filename = `lgs-search-results-${stamp}.csv`;
        } else {
            content = data.map(item =>
                `${item.name} [${item.setName}]\n` +
                `  Store: ${item.vendor}\n` +
                `  Condition: ${item.conditionName}${item.isFoil ? ' (Foil)' : ''}\n` +
                `  Price: $${parseFloat(item.price).toFixed(2)}  Qty: ${item.quantity}\n` +
                `  ${item.storeUrl}`
            ).join('\n\n');
            mime = 'text/plain';
            filename = `lgs-search-results-${stamp}.txt`;
        }

        const blob = new Blob([content], { type: `${mime};charset=utf-8` });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    let cardsTotal = 0;
    let cardsDone = 0;

    // Only the counter text changes as cards finish; rebuilding the spinner
    // element each time would restart its animation.
    function updateStatus() {
        const statusDiv = document.getElementById('status');
        let progress = statusDiv.querySelector('.status-progress');
        if (!progress) {
            statusDiv.innerHTML = '<span class="spinner"></span><span class="status-progress"></span>';
            progress = statusDiv.querySelector('.status-progress');
        }
        progress.textContent = `Searching\u2026 (${cardsDone}/${cardsTotal})`;
    }

    function handleGlobalHotkeys(e) {
        const mod = e.ctrlKey || e.metaKey;
        if (!mod) return;

        if (e.key === 'Enter') {
            e.preventDefault();
            startSearch();
            document.getElementById('cardInput').blur();
        } else if (e.shiftKey && e.code === 'KeyC') {
            // Ctrl/Cmd+Shift+C is also the browser's "inspect element" shortcut
            // in most browsers. preventDefault+stopPropagation here (plus
            // registering on the capture phase below) stops our own page from
            // reacting to it as a normal keypress, but a browser-level
            // shortcut like DevTools lives outside the page and JS can't
            // reliably override it.
            e.preventDefault();
            e.stopPropagation();
            copySearchLink();
        }
    }
    document.addEventListener('keydown', handleGlobalHotkeys, true);

    function flashButton(btn, label) {
        const original = btn.textContent;
        btn.textContent = label;
        btn.disabled = true;
        setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1500);
    }

    async function copySearchLink() {
        const input = document.getElementById('cardInput').value;
        const btn = document.getElementById('copyLinkBtn');
        try {
            if (input.trim()) await syncSearchToURL(input);
            await navigator.clipboard.writeText(location.href);
            flashButton(btn, 'Copied!');
        } catch (err) {
            flashButton(btn, 'Copy failed');
        }
    }

    function markVendorError(query, vendor, message) {
        const safeId = `term-${btoa(query).replace(/[^a-zA-Z0-9]/g, '')}`;
        const groupEl = document.getElementById(safeId);
        if (!groupEl) return;
        const errBox = groupEl.querySelector('.term-errors');
        if (!errBox || errBox.querySelector(`[data-vendor="${vendor}"]`)) return;
        const badge = document.createElement('span');
        badge.className = 'vendor-error-badge';
        badge.dataset.vendor = vendor;
        badge.title = message;
        badge.textContent = `⚠ ${vendor} unavailable`;
        errBox.appendChild(badge);
    }

    async function startSearch() {
        if (isSearching) return;
        const input = document.getElementById('cardInput').value;

        const originalLines = input.split('\n')
            .map(line => line.replace(/^\s*(?:\d+[xX]?\s*)?/, "").trim())
            .filter(c => c !== "");

        if (originalLines.length === 0) return;

        syncSearchToURL(input);

        document.getElementById('output').innerHTML = "";
        document.getElementById('status').innerHTML = "";

        storeCounts = { redcastle: 0, goingaming: 0, retroshark: 0 };
        updateStoreUI();
        allResults = [];
        setExportEnabled(false);

        isSearching = true;
        cardsTotal = originalLines.length;
        cardsDone = 0;
        const searchBtn = document.getElementById('searchBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusDiv = document.getElementById('status');
        searchBtn.disabled = true;
        resetBtn.textContent = 'Stop';
        updateStatus();

        originalLines.forEach(term => createGroup(term));

        currentAbortController = new AbortController();

        try {
            const response = await fetch('/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cards: originalLines }),
                signal: currentAbortController.signal
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let partial = '';

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                const lines = (partial + chunk).split('\n\n');
                partial = lines.pop();

                lines.forEach(line => {
                    if (line.startsWith('data: ')) {
                        try {
                            const payload = JSON.parse(line.slice(6));
                            if (Array.isArray(payload)) {
                                payload.forEach(item => renderTile(item.query, item));
                            } else if (payload.type === 'card_done') {
                                finalizeGroup(payload.query);
                                cardsDone++;
                                if (isSearching) updateStatus();
                            } else if (payload.type === 'vendor_error') {
                                markVendorError(payload.query, payload.vendor, payload.message);
                            }
                            // 'card_start' / 'all_done' are no-ops for now.
                        } catch (e) { console.error("Parse Error", e); }
                    }
                });
            }
            statusDiv.innerHTML = '<span class="checkmark">&#10003;</span> Done';
        } catch (err) {
            if (err.name === 'AbortError') {
                statusDiv.textContent = `Stopped (${cardsDone}/${cardsTotal} searched)`;
                markUnsearchedGroups();
            } else {
                statusDiv.innerHTML = "Error connecting to backend";
            }
        } finally {
            isSearching = false;
            currentAbortController = null;
            searchBtn.disabled = false;
            resetBtn.textContent = 'Clear';
        }
    }

    let storeCounts = { redcastle: 0, goingaming: 0, retroshark: 0 };

    function updateStoreUI() {
        document.getElementById('count-redcastle').textContent = `(${storeCounts.redcastle})`;
        document.getElementById('count-goingaming').textContent = `(${storeCounts.goingaming})`;
        document.getElementById('count-retroshark').textContent = `(${storeCounts.retroshark})`;
    }

    function createGroup(term) {
        const output = document.getElementById('output');
        const safeId = `term-${btoa(term).replace(/[^a-zA-Z0-9]/g, '')}`;
        if (!document.getElementById(safeId)) {
            const group = document.createElement('div');
            group.id = safeId;
            group.className = 'search-term-group';
            group.innerHTML = `<div class="term-header">${term}</div><div class="term-errors"></div><div class="results-grid"></div>`;
            output.appendChild(group);
        }
    }

    function finalizeGroup(query) {
        const safeId = `term-${btoa(query).replace(/[^a-zA-Z0-9]/g, '')}`;
        const groupEl = document.getElementById(safeId);
        if (!groupEl) return;
        groupEl.dataset.done = '1';
        const grid = groupEl.querySelector('.results-grid');
        if (grid.children.length === 0) {
            grid.innerHTML = '<div class="empty-state">No listings found</div>';
        }
    }

    // After Stop: cards that never finished and have nothing to show get a
    // note instead of an empty section. Partly searched cards keep their tiles.
    function markUnsearchedGroups() {
        document.querySelectorAll('.search-term-group:not([data-done])').forEach(groupEl => {
            const grid = groupEl.querySelector('.results-grid');
            if (grid.children.length === 0) {
                grid.innerHTML = '<div class="empty-state">Not searched (stopped)</div>';
            }
        });
    }

    function renderTile(headerTerm, item) {
        const safeId = `term-${btoa(headerTerm).replace(/[^a-zA-Z0-9]/g, '')}`;
        const groupEl = document.getElementById(safeId);
        if (!groupEl) return;

        const grid = groupEl.querySelector('.results-grid');
        const vendorClean = item.vendor.toLowerCase();

        // productId alone isn't a unique key: sibling TCGplayerPro stores
        // share the same underlying catalog, so the same productId can (and
        // does) show up across multiple vendors, and a single vendor can list
        // the same productId more than once (different condition/foil SKUs).
        // Dedup on the full listing identity instead, or distinct store
        // listings silently disappear whenever a productId collides.
        const uniqueKey = `${vendorClean}|${item.productId}|${item.conditionName}|${item.isFoil}`;
        if (!grid._seenListings) grid._seenListings = new Set();
        if (grid._seenListings.has(uniqueKey)) return;
        grid._seenListings.add(uniqueKey);

        allResults.push(item);
        setExportEnabled(true);

        if (vendorClean.includes('redcastle')) storeCounts.redcastle++;
        else if (vendorClean.includes('goingaming')) storeCounts.goingaming++;
        else if (vendorClean.includes('retroshark')) storeCounts.retroshark++;
        updateStoreUI();

        const tile = document.createElement('div');
        tile.className = 'card-tile';
        tile.dataset.price = item.price;
        tile.dataset.name = item.name.toLowerCase();
        tile.dataset.vendorClean = vendorClean;
        tile.dataset.productId = item.productId;
        tile.dataset.isFoil = item.isFoil;
        tile.dataset.conditionRank = conditionRank(item.conditionName);

        const isAllowed = Array.from(allowedStores).some(key => vendorClean.includes(key));
        if (!isAllowed) tile.classList.add('hidden-by-filter');

        let badgeClass = 'badge-default';
        if (vendorClean.includes('redcastle')) badgeClass = 'badge-redcastle';
        else if (vendorClean.includes('goingaming')) badgeClass = 'badge-goingaming';
        else if (vendorClean.includes('retroshark')) badgeClass = 'badge-retroshark';

        const imageUrl = `https://tcgplayer-cdn.tcgplayer.com/product/${item.productId}_200w.jpg`;

        tile.innerHTML = `
            <a href="${item.storeUrl}" class="tile-link" target="_blank">
                <div class="tile-image-wrap">
                    <img class="card-image" src="${imageUrl}" alt="${item.name}" loading="lazy">
                    ${item.isFoil ? '<span class="foil-sheen" aria-hidden="true"></span>' : ''}
                    <div class="badge ${badgeClass}">${item.vendor}</div>
                </div>
                <div class="tile-body">
                    <div class="card-name">${item.name}</div>
                    <div class="card-set">${item.setName}</div>
                    <div class="tile-meta">
                        <span class="condition">${item.conditionName}${item.isFoil ? ' <span class="foil-star-inline">★</span>' : ''}</span>
                        <span class="price">$${parseFloat(item.price).toFixed(2)}</span>
                    </div>
                    <span class="store-link">View Store &rarr;</span>
                </div>
            </a>
        `;
        grid.appendChild(tile);
        sortGrid(grid);
        applyMergeFilterToGrid(grid);
    }

    function sortAllGrids() {
        document.querySelectorAll('.results-grid').forEach(grid => sortGrid(grid));
    }

    function sortGrid(grid) {
        const mode = document.getElementById('sortOrder').value;
        const tiles = Array.from(grid.children);

        tiles.sort((a, b) => {
            if (mode === 'alpha') return a.dataset.name.localeCompare(b.dataset.name);
            if (mode === 'price-asc') return parseFloat(a.dataset.price) - parseFloat(b.dataset.price);
            if (mode === 'price-desc') return parseFloat(b.dataset.price) - parseFloat(a.dataset.price);
            return 0;
        });

        tiles.forEach(tile => grid.appendChild(tile));
    }

    // Set by the server from ?s=<id> (or a legacy ?q=) in the page URL.
    const SHARED_QUERY = {{ shared_query|tojson }};
    const SHARED_MISSING = {{ shared_missing|tojson }};

    // The text the current ?s= in the URL stands for, so repeat syncs skip
    // the round trip, and a counter so a slow /share reply for an older
    // search can't overwrite the URL of a newer one.
    let urlSharedText = new URLSearchParams(location.search).has('s') ? SHARED_QUERY : null;
    let syncSeq = 0;

    function setURLParams(update) {
        const params = new URLSearchParams(location.search);
        update(params);
        const query = params.toString();
        history.replaceState(null, '', query ? `${location.pathname}?${query}` : location.pathname);
    }

    async function syncSearchToURL(text) {
        if (text === urlSharedText) return;
        const seq = ++syncSeq;
        try {
            const response = await fetch('/share', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            if (!response.ok) throw new Error(`share failed: ${response.status}`);
            const { id } = await response.json();
            if (seq !== syncSeq) return;
            setURLParams(p => { p.delete('q'); p.set('s', id); });
            urlSharedText = text;
        } catch (err) {
            // Too big to store, or the server is unreachable: fall back to
            // putting the whole search in the URL, which still works.
            if (seq !== syncSeq) return;
            setURLParams(p => { p.delete('s'); p.set('q', text); });
            urlSharedText = null;
        }
    }

    (function loadSearchFromURL() {
        if (SHARED_QUERY) {
            document.getElementById('cardInput').value = SHARED_QUERY;
            startSearch();
        } else if (SHARED_MISSING) {
            setURLParams(p => p.delete('s'));
            const msg = document.createElement('span');
            msg.className = 'status-error';
            msg.textContent = "That shared search link wasn't found.";
            document.getElementById('status').appendChild(msg);
        }
    })();
</script>
</body>
</html>
